name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter './examples/*' exec prisma generate
      - run: pnpm check

  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        versions: [locked]
        # The oldest supported version of each library, and the first of a current major.
        include:
          - node: 24
            versions: prisma@7.1.0 @prisma/client@7.1.0 @prisma/adapter-pg@7.1.0
          - node: 20
            versions: fastify@4.26.0
          - node: 24
            versions: fastify@5.0.0
          - node: 20
            versions: express@4.18.0
          - node: 24
            versions: express@5.0.0
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: query_profiler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use other supported versions
        if: matrix.versions != 'locked'
        run: pnpm add -D -w ${{ matrix.versions }}
      - run: pnpm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  example:
    name: React Router example builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm examples:sync
      - run: pnpm --filter example-react-router exec prisma generate
      - run: pnpm --filter example-react-router build
      - name: The build has none of the profiler
        run: "! grep -rlE 'query-profiler-toolbar|X-Debug-Token|async_hooks' examples/react-router/build"

  website:
    name: Website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm website:build

  server-examples:
    name: ${{ matrix.example }} example runs without the profiler
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [fastify, express]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm examples:sync
      - run: pnpm --filter example-${{ matrix.example }} exec prisma generate
      - run: pnpm --filter example-${{ matrix.example }} build
      - name: Plain node loads none of the profiler, even with NODE_ENV=development; the condition alone turns it on
        working-directory: examples/${{ matrix.example }}
        env:
          NODE_ENV: development
        run: |
          PORT=3001 node dist/server.js &
          PORT=3002 env -u NODE_ENV node --conditions=development dist/server.js &
          curl --retry 30 --retry-connrefused --retry-delay 1 -s -o /dev/null http://localhost:3001/nope
          curl --retry 30 --retry-connrefused --retry-delay 1 -s -o /dev/null http://localhost:3002/nope
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/_profiler)" = 404
          ! curl -s -D - -o /dev/null http://localhost:3001/nope | grep -i x-debug-token
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/_profiler)" = 200
